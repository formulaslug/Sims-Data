[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "SD"
dynamic = ["version"]
dependencies = [
  "matplotlib",
  "polars",
  "numpy",
  "scipy",
  "json5",
]
readme = {file = "README.md", content-type = "text/markdown"}

[tool.setuptools.package-dir]
data = "Data/FSLib"
